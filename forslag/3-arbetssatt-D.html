<!doctype html><html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Schibsted+Grotesk:wght@400;500;700;800&family=Barlow+Condensed:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Fraunces:opsz,wght@9..144,400..800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Schibsted Grotesk',system-ui,sans-serif;font-size:18px;line-height:1.5;color:#1b1d1f;background:#fff}
img{display:block;max-width:100%}a{color:inherit}.w{max-width:1240px;margin:0 auto;padding:0 40px}
.s{background:#f5b400;padding:100px 0}
.s h2{font-family:'Barlow Condensed';text-transform:uppercase;font-weight:800;font-size:96px;line-height:.85;margin-bottom:50px}
.row{display:flex}
.c{flex:1;background:#111;color:#fff;padding:34px 60px 34px 56px;clip-path:polygon(0 0,calc(100% - 40px) 0,100% 50%,calc(100% - 40px) 100%,0 100%,40px 50%);margin-left:-28px}
.c:first-child{margin-left:0;clip-path:polygon(0 0,calc(100% - 40px) 0,100% 50%,calc(100% - 40px) 100%,0 100%)}
.c:nth-child(2){background:#2a2a2a}.c:nth-child(3){background:#3a3a3a}.c:nth-child(4){background:#4b4b4b}
.c span{font-family:'Barlow Condensed';font-weight:700;color:#f5b400;font-size:20px;text-transform:uppercase}
.c h3{font-family:'Barlow Condensed';font-weight:800;font-size:40px;text-transform:uppercase;line-height:1;margin:6px 0 8px}
.c p{font-size:16px;color:#cfcfcf}
</style></head><body><section class="s"><div class="w"><h2>Fyra steg<br>till färdig mark</h2><div class="row"><div class="c"><span>Steg 1</span><h3>Förfrågan</h3><p>Du ringer eller skickar formuläret.</p></div><div class="c"><span>Steg 2</span><h3>Platsbesök</h3><p>Vi tittar på tomten, tillfarten och marken.</p></div><div class="c"><span>Steg 3</span><h3>Offert</h3><p>Du får pris och tidplan skriftligt.</p></div><div class="c"><span>Steg 4</span><h3>Utförande</h3><p>Vi gräver, fyller igen och lämnar ytan klar.</p></div></div></div></section><!-- elevate-credit -->
<style>.elevate-credit{max-width:1240px;margin:24px auto 0;padding:20px 16px 0;border-top:1px solid rgba(128,128,128,.25);display:flex;justify-content:center;box-sizing:border-box}.elevate-credit a{display:inline-flex;align-items:center;gap:10px;padding:8px 0;font:inherit;font-size:15px;line-height:1;color:inherit;opacity:.55;text-decoration:none;transition:opacity .2s}.elevate-credit a:hover,.elevate-credit a:focus-visible{opacity:1}.elevate-credit svg{width:20px;height:20px;flex:none;display:block}@media(min-width:1024px){.elevate-credit a{font-size:16px}}</style>
<div class="elevate-credit"><a href="https://elevatestudio.nu" target="_blank" rel="noopener"><svg viewBox="0 0 1884.3 1353.9" aria-hidden="true"><path d="M0.0 1353.9 L1218.7 0.0 L1218.7 329.1 L479.7 1136.4 L786.7 1132.4 L1215.5 687.4 L1884.3 1349.9 L1590.1 1349.9 L1218.6 994.7 L865.4 1349.9Z" fill="currentColor"/></svg>Byggd av Elevate Studio</a></div>
